<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Kalkulator Lembur by Kei Project</title>
    <link rel="icon" type="image/png" href="/assets/kei-icon.png" />
    <meta name="description" content="Kalkulator presisi upah lembur dan estimasi gaji karyawan sesuai PP No. 35 Tahun 2021 dengan rincian per jam, mode harian & bulanan, dashboard riwayat, sinkronisasi cloud Kei Pro, dan ekspor bukti slip PNG." />
    <meta property="og:title" content="Kalkulator Lembur by Kei Project" />
    <meta property="og:description" content="Kalkulator presisi upah lembur dan estimasi gaji karyawan sesuai PP No. 35 Tahun 2021 dengan rincian per jam, mode harian & bulanan, dashboard riwayat, sinkronisasi cloud Kei Pro, dan ekspor bukti slip PNG." />
    <meta property="og:image" content="/assets/kei-pro-logo.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0A0A12" />
    <script>
      (function() {
        try {
          var s = localStorage.getItem('lembur_settings_v1.1');
          var t = s ? JSON.parse(s).theme : 'dark';
          document.documentElement.classList.add(t === 'light' ? 'light' : 'dark');
        } catch(e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body class="min-h-screen selection:bg-[#00F0FF]/30 selection:text-white antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
