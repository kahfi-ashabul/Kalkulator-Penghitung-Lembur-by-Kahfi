      (function() {
        try {
          var s = localStorage.getItem('lembur_settings_v1.1');
          var t = s ? JSON.parse(s).theme : 'dark';
          document.documentElement.classList.add(t === 'light' ? 'light' : 'dark');
        } catch(e) {
          document.documentElement.classList.add('dark');
        }
      })();
